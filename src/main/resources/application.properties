spring.application.name=vehicles-api

# Profile por defeito (em Docker/CI sobrepõe-se com SPRING_PROFILES_ACTIVE=prod)
spring.profiles.active=dev

# O schema é gerido pelo Flyway; o Hibernate só valida que a entidade bate certo com ele
spring.jpa.hibernate.ddl-auto=validate
# evita lazy loading "escondido" durante a serialização (ver §2 do guia de backend)
spring.jpa.open-in-view=false

# origens autorizadas a chamar a API a partir do browser (separadas por vírgula)
app.cors.allowed-origins=http://localhost:4200

# Actuator: saúde da aplicação (usado também pelo Kubernetes)
management.endpoints.web.exposure.include=health,info
management.endpoint.health.probes.enabled=true