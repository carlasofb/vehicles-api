spring.application.name=vehicles-api

# Profile por defeito (em Docker/CI sobrepõe-se com SPRING_PROFILES_ACTIVE=prod)
spring.profiles.active=dev

# O schema é gerido pelo Flyway; o Hibernate só valida que a entidade bate certo com ele
spring.jpa.hibernate.ddl-auto=validate
# evita lazy loading "escondido" durante a serialização (ver §2 do guia de backend)
spring.jpa.open-in-view=false

# origens autorizadas a chamar a API a partir do browser (separadas por vírgula)
app.cors.allowed-origins=http://localhost:4200

# Actuator: saúde da aplicação (usado também pelo Kubernetes)
management.endpoints.web.exposure.include=health,info
management.endpoint.health.probes.enabled=true

# acrescenta ao application.properties (comum)
app.kafka.enabled=false
spring.kafka.bootstrap-servers=localhost:9092

spring.kafka.producer.key-serializer=org.apache.kafka.common.serialization.StringSerializer
spring.kafka.producer.value-serializer=org.springframework.kafka.support.serializer.JacksonJsonSerializer
spring.kafka.producer.properties.spring.json.add.type.headers=false

spring.kafka.consumer.group-id=maintenance-service
spring.kafka.consumer.auto-offset-reset=earliest
spring.kafka.consumer.key-deserializer=org.apache.kafka.common.serialization.StringDeserializer
spring.kafka.consumer.value-deserializer=org.springframework.kafka.support.serializer.JacksonJsonDeserializer
spring.kafka.consumer.properties.spring.json.use.type.headers=false
spring.kafka.consumer.properties.spring.json.value.default.type=com.example.vehicles.events.VehicleStatusChanged
spring.kafka.consumer.properties.spring.json.trusted.packages=com.example.vehicles.events